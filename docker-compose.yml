version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/app.db
      SECRET_KEY: docker-secret-key-change-in-production-min-32-chars
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: 60
      CORS_ORIGINS: http://localhost:80,http://127.0.0.1:80
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"
    x-preview-port: 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_HOST: backend
    ports:
      - "80:80"
    depends_on:
      - backend
    x-preview-port: 80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
    driver: local
